<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Centrica Spark — multi-agent AI innovation platform">
  <defs>
    <linearGradient id="sparkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1206"/>
      <stop offset="1" stop-color="#0d0a14"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sparkBg)"/>
  <g stroke="#3a2f1a" stroke-width="1" opacity="0.4">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800"/>
    <path d="M200 0 V400 M400 0 V400 M600 0 V400"/>
  </g>
  <!-- central orchestrator (idea/spark) -->
  <circle cx="200" cy="200" r="120" fill="url(#sparkGlow)" opacity="0.35"/>
  <!-- spark icon -->
  <g transform="translate(200 200)">
    <path d="M-6 -70 L14 -10 L-2 -6 L10 60 L-18 -4 L0 -8 Z" fill="#fbbf24" stroke="#fde68a" stroke-width="2"/>
  </g>
  <!-- edges to specialized agents -->
  <g stroke="url(#sparkEdge)" stroke-width="2.5" opacity="0.9">
    <line x1="260" y1="150" x2="540" y2="80"/>
    <line x1="270" y1="185" x2="540" y2="160"/>
    <line x1="270" y1="215" x2="540" y2="240"/>
    <line x1="260" y1="250" x2="540" y2="320"/>
  </g>
  <!-- specialized agents -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="540" y="55" width="185" height="50" rx="12" fill="#1c1630" stroke="#a78bfa" stroke-width="2"/>
      <text x="560" y="86" font-size="18" font-weight="600" fill="#ede9fe">Research Agent</text>
    </g>
    <g>
      <rect x="540" y="135" width="185" height="50" rx="12" fill="#1c1630" stroke="#a78bfa" stroke-width="2"/>
      <text x="560" y="166" font-size="18" font-weight="600" fill="#ede9fe">Feasibility Agent</text>
    </g>
    <g>
      <rect x="540" y="215" width="185" height="50" rx="12" fill="#1c1630" stroke="#a78bfa" stroke-width="2"/>
      <text x="560" y="246" font-size="18" font-weight="600" fill="#ede9fe">Risk Agent</text>
    </g>
    <g>
      <rect x="540" y="295" width="185" height="50" rx="12" fill="#1c1630" stroke="#a78bfa" stroke-width="2"/>
      <text x="560" y="326" font-size="17" font-weight="600" fill="#ede9fe">Recommendation</text>
    </g>
  </g>
  <g fill="#faf5ff" font-family="Segoe UI, Arial, sans-serif">
    <text x="150" y="345" font-size="30" font-weight="700" text-anchor="middle">Spark</text>
    <text x="150" y="373" font-size="15" fill="#fcd34d" text-anchor="middle">Multi-Agent Innovation</text>
  </g>
</svg>
