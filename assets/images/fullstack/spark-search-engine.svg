<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Spark Search Engine — a search bar over a ranked list of ideas">
  <defs>
    <linearGradient id="ssbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ssbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="ssacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="ssglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="340" fill="url(#ssbg)"/>

  <!-- faint grid -->
  <g stroke="#1f2b45" stroke-width="1" opacity="0.55">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800"/>
    <path d="M120 0 V340 M280 0 V340 M440 0 V340 M600 0 V340 M720 0 V340"/>
  </g>

  <!-- search bar -->
  <g>
    <rect x="60" y="70" width="680" height="64" rx="32" fill="url(#ssbar)" stroke="#3b82f6" stroke-width="2"/>
    <!-- magnifier -->
    <g transform="translate(96,102)" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="12"/>
      <path d="M9 9 L20 20"/>
    </g>
    <text x="132" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f2937">Where is the idea for reducing GPU inference latency?</text>
    <!-- blinking cursor -->
    <rect x="686" y="88" width="3" height="28" fill="#3b82f6">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ranked results -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <g transform="translate(60,176)">
      <circle cx="14" cy="14" r="7" fill="url(#ssacc)" filter="url(#ssglow)"/>
      <text x="40" y="20" font-size="19" fill="#e5e7eb">GPU inference optimization</text>
      <rect x="560" y="6" width="120" height="16" rx="8" fill="#1f2b45"/>
      <rect x="560" y="6" width="112" height="16" rx="8" fill="url(#ssacc)" opacity="0.9"/>
    </g>
    <g transform="translate(60,214)">
      <circle cx="14" cy="14" r="7" fill="#3b82f6"/>
      <text x="40" y="20" font-size="19" fill="#cbd5e1">KV-cache optimization</text>
      <rect x="560" y="6" width="120" height="16" rx="8" fill="#1f2b45"/>
      <rect x="560" y="6" width="86" height="16" rx="8" fill="#3b82f6" opacity="0.85"/>
    </g>
    <g transform="translate(60,252)">
      <circle cx="14" cy="14" r="7" fill="#3b82f6" opacity="0.8"/>
      <text x="40" y="20" font-size="19" fill="#94a3b8">Continuous batching</text>
      <rect x="560" y="6" width="120" height="16" rx="8" fill="#1f2b45"/>
      <rect x="560" y="6" width="64" height="16" rx="8" fill="#3b82f6" opacity="0.7"/>
    </g>
    <g transform="translate(60,290)">
      <circle cx="14" cy="14" r="7" fill="#3b82f6" opacity="0.6"/>
      <text x="40" y="20" font-size="19" fill="#64748b">PagedAttention</text>
      <rect x="560" y="6" width="120" height="16" rx="8" fill="#1f2b45"/>
      <rect x="560" y="6" width="48" height="16" rx="8" fill="#3b82f6" opacity="0.55"/>
    </g>
  </g>
</svg>
