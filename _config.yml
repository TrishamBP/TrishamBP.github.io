# Site settings
title: Trisham Patil
email: 
description: "AI systems engineering, LLMs and production AI by Trisham Patil."
baseurl: ""
url: "https://trishampatil.com"
twitter_username: karpathy
github_username:  karpathy

# Newsletter (The Weekly Tech Brew). Your Buttondown username, as in
# buttondown.com/<username>. The subscribe form renders only once this is set;
# Buttondown emails each new issue from /newsletter/feed.xml (RSS-to-email).
buttondown_username: ""

# Build settings
markdown: kramdown
permalink: pretty

# raw_data/ holds third-party source material kept locally for reference while
# writing. Its files carry frontmatter, so Jekyll was rendering and publishing
# them as real pages (complete with the original `source:` URL). Excluded so
# they stay local-only.
exclude:
  - raw_data
  - eagle_three
  - harness_engineering

highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

plugins:

collections:
  research:
    output: true
    permalink: /research-articles/:name/
  learning_papers:
    output: true
    permalink: /learning-lab/:name/
  papers:
    output: false
    sort_by: date
  implementations:
    output: true
    permalink: /engineering/:name/
  # Physical AI → Exploratory Research: studies/explorations of research
  # (e.g. SIMA), NOT engineering implementations. Same authoring pattern
  # as `implementations`, but nested under the Physical AI world.
  exploratory_research:
    output: true
    permalink: /physical-ai/exploratory-research/:name/
  # The Weekly Tech Brew: one file per weekly edition, listed on /newsletter/.
  # Each edition sets an explicit `date:` (collection docs have no implicit one).
  newsletters:
    output: true
    sort_by: date
    permalink: /newsletter/:name/

# The typesafe theme is the site-wide default (see _includes/head.html), and
# that now includes the exploratory-research entries: Physical AI is hidden
# from the nav and those entries are listed under /blog/, so they should look
# like every other article rather than keeping the old dark Physical AI skin.
#
# The Physical AI landing page is unaffected either way — it uses the standalone
# _layouts/physical-ai.html, which has its own <head> and never includes
# _includes/head.html. Opt any page out with `theme: none` in frontmatter.
