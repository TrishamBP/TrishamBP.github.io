# ─────────────────────────────────────────────────────────────
# Engineering Implementations — Website Taxonomy (source of truth)
#
# This drives the /engineering/ landing grid, the per-category
# pages, subcategory filters, and the dynamic implementation counts.
#
# To add a new implementation: create the file in _implementations/
# and set `category:` (and optionally `subcategory:`) to an id below.
# It will appear on the matching category page automatically.
# ─────────────────────────────────────────────────────────────

- id: transformers-attention
  title: "Transformers & Attention"
