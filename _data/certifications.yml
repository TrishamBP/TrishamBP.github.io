# ─────────────────────────────────────────────────────────────
# Licenses & Certifications — data source
#
# Drives the /certifications/ page grid (sorted newest first by `issued`).
#
# Fields:
#   title          — certificate / course name
#   issuer         — issuing organisation
#   issued         — YYYY-MM, used for sorting
#   date           — human-readable issue date (e.g. "Sep 2026")
#   credential_id  — credential ID shown on the card
#   url            — "Show credential" link (leave "" to hide the button)
#   image          — certificate image path, e.g.
#                    /assets/images/certifications/ibm-bob-hackathon.png
#                    (leave "" to show a styled placeholder)
#   description    — 1–2 line summary
#   skills         — optional list of skills
# ─────────────────────────────────────────────────────────────

