- name: AKV-Sem
  group: Open source libraries and plugins
  summary: Semantic-aware KV cache engineering for LLM agents, built on the AKV framework.
  stack: [Python, SGLang, KV cache, LLM agents]
  details:
    - label: What it does
      text: >-
        Agent-side policies decide which messages to drop from the KV cache and
        when to reposition retained tokens, and an SGLang-based system executes
        those operations while reusing compatible KV cache.
    - label: My contribution
      text: >-
        Semantic awareness: the agent labels every dropped path as failed,
        irrelevant or resolved, with a reason. Those notes stay in context after
        the KV entries are gone, so the agent stops repeating dead ends.
  highlights:
    - I built the semantic policy, its tests and the semantic demo mode.
    - The underlying AKV framework is by Tianyu Fu et al., used under Apache-2.0.
  links:
    - label: View on GitHub
      url: https://github.com/TrishamBP/AKV-Sem
    - label: AKV paper
      url: https://arxiv.org/pdf/2610.28577

- name: Harness Engineering
  group: Open source libraries and plugins
  summary: A small, fully tested reference agent harness in pure-stdlib Python.
  stack: [Python, Agent harness, Context engineering, Zero dependencies]
  details:
    - label: What it does
      text: >-
        Every subsystem of a production coding-agent runtime is its own tested
        module: agent loop, typed tool registry, concurrency-aware scheduler,
        policy engine, verify-on-stop guard, event log and orchestration.
    - label: Context and memory
      text: >-
        A cache-stable prompt, just-in-time AGENTS.md and CLAUDE.md loading,
        compaction with incremental summaries, and bounded memory.
  highlights:
    - 79 passing tests and 36 Mermaid diagrams, with no third-party dependencies in the core.
  links:
    - label: View on GitHub
      url: https://github.com/TrishamBP/harness-engineering
    - label: Read the write-up
      url: /engineering/harness-engineering/

