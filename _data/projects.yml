# Projects shown on /projects/. Grouped by `group` (order of first appearance
# sets the section order). Every field except `name`, `group` and `summary` is
# optional: rows without `details`, `highlights` or `links` simply render less.
#
#   summary     one line under the title in the collapsed row
#   stack       tech chips
#   details     list of { label, text } paragraphs shown when expanded
#   highlights  bullet points shown when expanded
#   links       list of { label, url } buttons; the first one is the primary
#   image       optional preview image (path from site root) + image_alt

- name: Dhokla House
  group: Live products
  year: "2022–2023"
  summary: Production food-ordering and brand platform built for menu discovery and fast checkout.
  stack: [React.js, Node.js, Express.js, PostgreSQL, MongoDB]
  details:
    - label: Frontend
      text: >-
        React.js with modular UI components and responsive layouts, so browsing,
        add-to-cart and checkout stay fast on mobile and desktop.
    - label: Backend
      text: >-
        Node.js and Express.js APIs for menu retrieval, customer interaction flows
        and transactional order endpoints, with route and service layers kept apart.
    - label: Data layer
      text: >-
        PostgreSQL holds the order lifecycle and reporting data. MongoDB stores
        content and interaction metadata whose schema changes often.
  links:
    - label: Visit site
      url: https://dhoklahouse.com/

- name: Apni Dukaan
  group: Live products
  year: "2022–2023"
  summary: E-commerce platform covering catalog browsing, checkout and order management.
  stack: [React.js, Node.js, Express.js, PostgreSQL, MongoDB]
  details:
    - label: Frontend
      text: >-
        Reusable catalog, product-detail and checkout components in React.js,
        designed to remove friction from the purchase flow.
    - label: Backend
      text: >-
        Express APIs for products, cart and orders, with read-heavy catalog routes
        separated from transactional checkout and order-update routes.
    - label: Data and scaling
      text: >-
        PostgreSQL for consistency-sensitive orders and reporting, MongoDB for
        flexible product metadata, so each side scales as volume grows.
  links:
    - label: Visit site
      url: https://apnidukaan.com/

- name: ThermaCore
  group: AI and LLM engineering
  summary: AI for data center operations, built for the AMD ACT III Hackathon.
  stack: [Python, Apache Kafka, XGBoost, LangGraph, DuckDB, FastAPI]
  details:
    - label: What it does
      text: >-
        Ingests server telemetry through Kafka, assesses each server's thermal
        and cooling state with deterministic rules, and forecasts inlet
        temperature with XGBoost.
    - label: Agents
      text: >-
        Operators investigate through a LangGraph multi-agent recommendation
        workflow, a natural-language copilot and a digital-twin API built for a
        Three.js frontend. The system only recommends; it never controls hardware.
  highlights:
    - All telemetry is simulated from a synthetic Kaggle dataset and labelled as such.
  links:
    - label: View on GitHub
      url: https://github.com/TrishamBP/ThermaCore

- name: Autopay Recovery Voice Agent
  group: AI and LLM engineering
  summary: FastAPI backend for a simulated autopay and EMI payment-recovery voice agent.
  stack: [Python, FastAPI, SQLAlchemy, SQLite, Twilio, Fireworks AI]
  details:
    - label: What it does
      text: >-
        A virtual clock and event ledger drive payment and recovery state
        machines. Recovery calls go through an approval queue, and no call is
        placed without explicit human approval.
    - label: Voice and data
      text: >-
        Twilio webhooks, a conversation engine with transcripts and audit logs,
        and a read-only natural-language-to-SQL tool. All data is synthetic and
        payments are simulated.
  links:
    - label: View on GitHub
      url: https://github.com/TrishamBP/Autopay-Recovery-Voice-Agent

- name: LLM Router
  group: AI and LLM engineering
  summary: Hybrid neural network and XGBoost router that picks a Claude model version for each query.
  stack: [Python, PyTorch, XGBoost, scikit-learn, Fireworks AI]
  details:
    - label: What it does
      text: >-
        Sends every prompt to the cheapest Claude model that can handle it,
        trading off predicted quality, latency and cost. Prompts are embedded,
        classified as easy, medium or hard, and routed to Haiku, Sonnet or Opus.
  links:
    - label: View on GitHub
      url: https://github.com/TrishamBP/llm-router
    - label: Model card
      url: https://huggingface.co/Trisham97/llm-complexity-router

- name: EAGLE-3 Reproduction
  group: AI and LLM engineering
  summary: Runnable PyTorch reconstruction of EAGLE-3 speculative decoding for faster LLM inference.
  stack: [Python, PyTorch, Speculative decoding]
  details:
    - label: What it does
      text: >-
        Rebuilds the EAGLE-3 draft model, multi-layer feature fusion,
        training-time test and lossless verification, with a chain-draft
        inference engine and one script per correctness experiment.
  highlights:
    - Greedy EAGLE-3 output matches the target model token for token.
    - Not the official implementation, and it does not measure the paper's GPU speedups.
  links:
    - label: View on GitHub
      url: https://github.com/TrishamBP/eagle_3
    - label: Read the write-up
      url: /engineering/eagle-3-speculative-decoding-llm-inference-acceleration/

- name: ACME Onboard
  group: AI and LLM engineering
  summary: AI employee-onboarding platform with RAG over company documents, built for the IBM Bob 2.0 Hackathon.
  stack: [Next.js, TypeScript, FastAPI, ChromaDB, RAG, Fireworks AI]
  details:
    - label: What it does
      text: >-
        HR uploads onboarding documents by department through a management
        portal. Employees ask an AI knowledge assistant that answers with
        department-aware retrieval-augmented generation.
    - label: Retrieval
      text: >-
        Hybrid search with BM25 and embeddings, fused with RRF, plus HyDE query
        expansion, MMR diversification and Qwen3 reranking.
  links:
    - label: View on GitHub
      url: https://github.com/TrishamBP/IBM_Bob_2.0_Hackathon
