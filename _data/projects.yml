- name: ThermaCore
  group: AI and LLM engineering
  video: /assets/thermacore.mp4
  video_poster: /assets/images/projects/thermacore-poster.jpg
  video_length: "0:22"
  video_caption: >-
    ThermaCore launch video: the 3D data center digital twin on simulated
    telemetry.
  summary: AI for data center operations, built for the AMD ACT III Hackathon.
  stack: [Python, Apache Kafka, XGBoost, LangGraph, DuckDB, FastAPI]
  details:
    - label: What it does
      text: >-
        Ingests server telemetry through Kafka, assesses each server's thermal
        and cooling state with deterministic rules, and forecasts inlet
        temperature with XGBoost.
    - label: Agents
      text: >-
        Operators investigate through a LangGraph multi-agent recommendation
