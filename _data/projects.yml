- name: Football Video Intelligence
  group: Computer vision and data analytics
  wide: true
  image: /assets/images/projects/football-analysis-yolo-player-tracking.gif
  image_alt: >-
    YOLO football player tracking demo: team-coloured player markers with track
    IDs, referee and ball markers, a ball possession bar, camera movement and
    live speed and distance for each player
  summary: Computer-vision pipeline that turns broadcast football video into player tracking and match analytics.
  stack: [Python, PyTorch, Ultralytics YOLOv8, ByteTrack, OpenCV, scikit-learn, pandas]
  details:
    - label: Detection and tracking
      text: >-
        YOLOv8x at 1280 px detects players, goalkeepers, referees and the ball in
        batched GPU inference. ByteTrack keeps stable IDs across frames, and the
        ball trajectory is interpolated through missed detections.
    - label: Analytics
      text: >-
        Lucas-Kanade optical flow removes camera motion, a homography maps
        positions to pitch metres, KMeans on jersey colours assigns teams, and
        the pipeline computes ball possession plus per-player speed and distance.
  highlights:
    - Cached stubs are fingerprinted to the source video, so swapping the clip rebuilds them.
    - Frames are decoded lazily and streamed to the writer instead of held in RAM.
    - The detector weights come from Roboflow sports; the demo clip is from the DFL Bundesliga Data Shootout.
  links:
    - label: View on GitHub
      url: https://github.com/TrishamBP/football_analysis_yolo
