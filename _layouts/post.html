---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%B %Y" }}{% if page.author %} • {{ page.author }}{% endif %}{% if page.meta %} • {{ page.meta }}{% endif %}</p>
  </header>

  <article class="post-content">
  {{ content }}
  </article>
  <script>
    (function () {
      var post = document.querySelector(".post-content");
      if (!post) return;
      var firstHeading = post.querySelector("h1");
      if (!firstHeading) return;
      var pageTitle = {{ page.title | jsonify }};
      var headingText = (firstHeading.textContent || "").trim();
      if (headingText && pageTitle && headingText.toLowerCase() === String(pageTitle).trim().toLowerCase()) {
        firstHeading.remove();
      }
    })();
  </script>

  <!-- mathjax (loaded only on pages that opt in via `mathjax: true`).
       kramdown converts $$...$$ display blocks into <script type="math/tex">,
       which MathJax v2 processes natively; tex2jax handles inline $...$ that
       remain as text. pre/code/script are skipped so Mermaid + code blocks are safe.
       NOTE: the old MathJax CDN was retired in 2017; load v2.7.7 from cdnjs. -->
  {% if page.mathjax %}
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        skipTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      TeX: { equationNumbers: { autoNumber: 'none' } },
      "HTML-CSS": { linebreaks: { automatic: true }, scale: 96 }
    });
  </script>
  <script
    type="text/javascript"
    async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_CHTML"
  ></script>
  {% endif %}
  
  <!-- disqus comments -->
 {% if page.comments %}
 <div id="disqus_thread"></div>
  <script type="text/javascript">
      /* * * CONFIGURATION VARIABLES: EDIT BEFORE PASTING INTO YOUR WEBPAGE * * */
      var disqus_shortname = 'karpathyblog'; // required: replace example with your forum shortname

      /* * * DON'T EDIT BELOW THIS LINE * * */
      (function() {
          var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true;
          dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
          (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
      })();
  </script>
  <noscript>Please enable JavaScript to view the <a href="http://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
  <a href="http://disqus.com" class="dsq-brlink">comments powered by <span class="logo-disqus">Disqus</span></a>
  {% endif %}
  
</div>
