<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <nav class="topnav" id="topnav">
      <div class="topnav-inner">
        <a class="topnav-brand" href="{{ '/' | relative_url }}">Trisham Patil</a>
        <div class="topnav-links" id="topnav-links">
          <a
            class="topnav-link{% if page.url == '/' or page.url == '/index.html' %} active{% endif %}"
            href="{{ '/' | relative_url }}"
          >Home</a>
          <a
            class="topnav-link{% if page.url contains '/projects' %} active{% endif %}"
            href="{{ '/projects/' | relative_url }}"
          >Projects</a>
          <a
            class="topnav-link{% if page.url contains '/blog' %} active{% endif %}"
            href="{{ '/blog/' | relative_url }}"
          >Blogs</a>
          <a
            class="topnav-link{% if page.url contains '/research' %} active{% endif %}"
            href="{{ '/research-articles/' | relative_url }}"
          >Research Articles</a>
          <a
            class="topnav-link{% if page.url contains '/learning-lab' %} active{% endif %}"
            href="{{ '/learning-lab/' | relative_url }}"
          >Learning Lab</a>
          <a
            class="topnav-link{% if page.url contains '/resume' %} active{% endif %}"
            href="{{ '/resume/' | relative_url }}"
          >Resume</a>
          <a
            class="topnav-link"
            href="https://huggingface.co/spaces/Trisham97/AI-Career-Twin"
            target="_blank"
            rel="noopener noreferrer"
          >AI Twin</a>
        </div>
        <button
          class="topnav-hamburger"
          id="topnav-hamburger"
          aria-label="Toggle navigation"
          aria-expanded="false"
        >
          <span></span><span></span><span></span>
        </button>
        <button
          class="dark-mode-toggle"
          id="dark-mode-toggle"
          type="button"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        >
          <span class="icon-sun" aria-hidden="true">&#9728;</span>
          <span class="icon-moon" aria-hidden="true">&#9790;</span>
        </button>
      </div>
    </nav>
    <main class="site-shell">{{ content }}</main>
    <script>
      (function () {
        var root = document.body;
        var toggle = document.getElementById("dark-mode-toggle");
        if (!toggle) return;

        var stored = localStorage.getItem("theme");
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored ? stored === "dark" : prefersDark;

        function applyMode(darkEnabled) {
          root.classList.toggle("dark-mode", darkEnabled);
          toggle.setAttribute(
            "aria-label",
            darkEnabled ? "Switch to light mode" : "Switch to dark mode"
          );
        }

        applyMode(isDark);

        toggle.addEventListener("click", function () {
          isDark = !isDark;
          localStorage.setItem("theme", isDark ? "dark" : "light");
          applyMode(isDark);
        });
      })();
    </script>
    <script>
      (function () {
        var btn = document.getElementById("topnav-hamburger");
        var links = document.getElementById("topnav-links");
        if (!btn || !links) return;
        btn.addEventListener("click", function () {
          var open = links.classList.toggle("open");
          btn.setAttribute("aria-expanded", open ? "true" : "false");
        });
        document.addEventListener("click", function (e) {
          if (!btn.contains(e.target) && !links.contains(e.target)) {
            links.classList.remove("open");
            btn.setAttribute("aria-expanded", "false");
          }
        });
      })();
    </script>
    <script>
      (function () {
        function escapeHtml(value) {
          return value
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function toDiagramContainers() {
          var blocks = document.querySelectorAll("pre code.language-mermaid");
          blocks.forEach(function (code) {
            var source = (code.textContent || "").trim();
            if (!source) return;

            var container = document.createElement("div");
            container.className = "mermaid-diagram";
            container.setAttribute("data-mermaid-source", source);

            var pre = code.parentElement;
            if (pre && pre.parentElement) {
              pre.parentElement.replaceChild(container, pre);
            }
          });
        }

        function loadMermaidScript() {
          if (window.mermaid) return Promise.resolve();
          return new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.src =
              "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js";
            script.async = true;
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
          });
        }

        async function renderMermaid() {
          toDiagramContainers();

          var diagrams = document.querySelectorAll(".mermaid-diagram");
          if (!diagrams.length) return;

          try {
            await loadMermaidScript();
          } catch (error) {
            return;
          }

          var isDark = document.body.classList.contains("dark-mode");
          window.mermaid.initialize({
            startOnLoad: false,
            securityLevel: "loose",
            theme: isDark ? "dark" : "default"
          });

          for (var index = 0; index < diagrams.length; index += 1) {
            var diagram = diagrams[index];
            var source = diagram.getAttribute("data-mermaid-source") || "";
            var renderId =
              "mermaid-" + index + "-" + (isDark ? "dark" : "light");

            try {
              var rendered = await window.mermaid.render(renderId, source);
              diagram.innerHTML = rendered.svg;
            } catch (error) {
              diagram.innerHTML =
                "<pre><code>" + escapeHtml(source) + "</code></pre>";
            }
          }
        }

        function renderLater() {
          window.setTimeout(renderMermaid, 30);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", renderMermaid);
        } else {
          renderMermaid();
        }

        var toggle = document.getElementById("dark-mode-toggle");
        if (toggle) {
          toggle.addEventListener("click", renderLater);
        }
      })();
    </script>
  </body>
</html>
